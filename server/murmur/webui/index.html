<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murmur 看板</title>
<link rel="icon" href="/mark.svg">
<style>
:root{
  --bg:#0f1113; --panel:#16191c; --panel-2:#1c2024; --line:#262b30;
  --ink:#e8e6e3; --ink-2:#a8a49f; --ink-3:#6f6b66;
  --coral:#F2705C; --green:#5fbf8f; --amber:#e0a44a; --red:#e05a4a; --blue:#6aa9d8;
  --violet:#8b7cf6;
  --radius:12px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#f7f6f4; --panel:#fff; --panel-2:#f2f0ed; --line:#e3e0dc;
    --ink:#1c1a18; --ink-2:#5f5b57; --ink-3:#94908b;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
       "Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
.mono{font-family:var(--mono);font-size:12px}
.dim{color:var(--ink-2)}
.dimmer{color:var(--ink-3)}

/* ---------- 骨架 ---------- */
#app{display:grid;grid-template-columns:300px 1fr;height:100vh}
aside{
  border-right:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;min-height:0;
}
main{overflow-y:auto;min-width:0}

/* ---------- 头 ---------- */
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand img{width:26px;height:26px}
.brand h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
.brand .tick{margin-left:auto;font-size:11px;color:var(--ink-3);font-family:var(--mono)}

.pills{display:flex;gap:6px;padding:0 16px 12px;flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;
  background:var(--panel-2);border:1px solid var(--line);font-size:11px;color:var(--ink-2);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.up{background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 22%,transparent)}
.dot.warn{background:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 22%,transparent)}
.dot.down{background:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 22%,transparent)}
.dot.off{background:var(--ink-3)}

.navbtn{
  display:block;width:calc(100% - 20px);margin:0 10px 4px;padding:8px 10px;text-align:left;
  background:none;border:0;border-radius:8px;color:var(--ink-2);font:inherit;font-size:13px;
  cursor:pointer;
}
a.navbtn{text-decoration:none}
.navbtn:hover{background:var(--panel-2);color:var(--ink)}
.navbtn.on{background:color-mix(in srgb,var(--coral) 14%,transparent);color:var(--coral)}

.seclabel{
  padding:14px 16px 6px;font-size:11px;letter-spacing:.08em;color:var(--ink-3);
  text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;
}
.people{overflow-y:auto;flex:1;min-height:0;padding-bottom:12px}
.filters{display:flex;gap:4px;padding:0 12px 8px;flex-wrap:wrap}
.search{padding:0 12px 8px}
.search input{
  width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--ink);font:inherit;font-size:12px;outline:none;
}
.search input:focus{border-color:var(--coral);box-shadow:0 0 0 2px color-mix(in srgb,var(--coral) 16%,transparent)}
.search input::placeholder{color:var(--ink-3)}
.fchip{
  padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:none;
  color:var(--ink-3);font:inherit;font-size:11px;cursor:pointer;
}
.fchip:hover{color:var(--ink);border-color:var(--ink-3)}
.fchip.on{color:var(--ink);background:var(--panel-2);border-color:var(--ink-3)}
.fchip.wx.on{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent);
  background:color-mix(in srgb,var(--green) 12%,transparent)}
.fchip.dt.on{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent);
  background:color-mix(in srgb,var(--amber) 12%,transparent)}
.fchip.tg.on{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 45%,transparent);
  background:color-mix(in srgb,var(--blue) 12%,transparent)}
.fchip.qq.on{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 45%,transparent);
  background:color-mix(in srgb,var(--violet) 12%,transparent)}

.plathead{
  display:flex;align-items:center;gap:6px;padding:10px 16px 4px;
  font-size:11px;color:var(--ink-3);letter-spacing:.04em;
}
.plathead .cnt{margin-left:auto;font-family:var(--mono);font-size:10px}

.person{
  display:block;width:calc(100% - 20px);margin:0 10px 3px;padding:8px 10px 8px 12px;
  background:none;border:0;border-radius:9px;text-align:left;color:inherit;
  font:inherit;cursor:pointer;position:relative;
}
.person::before{
  content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;
  background:var(--ink-3);
}
.person.tg::before{background:var(--blue)}
.person.dt::before{background:var(--amber)}
.person.wx::before{background:var(--green)}
.person.qq::before{background:var(--violet)}
.person:hover{background:var(--panel-2)}
.person.on{background:color-mix(in srgb,var(--coral) 13%,transparent)}
.person .row1{display:flex;align-items:center;gap:6px}
.person .name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.person .when{margin-left:auto;font-size:10px;color:var(--ink-3);flex:none;
  font-family:var(--mono)}
.person .prev{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;margin-top:1px}
.tag{
  font-size:10px;padding:1px 6px;border-radius:4px;flex:none;letter-spacing:.02em;
  border:1px solid transparent;
}
.tag.tg{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue)}
.tag.dt{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.tag.wx{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.tag.qq{background:color-mix(in srgb,var(--violet) 18%,transparent);color:var(--violet)}
.tag.q  {background:var(--panel-2);color:var(--ink-3)}
.tag.watch{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.tag.hold{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.pmark{
  width:18px;height:18px;border-radius:5px;display:inline-flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:600;flex:none;letter-spacing:0;
}
.pmark.tg{background:color-mix(in srgb,var(--blue) 22%,transparent);color:var(--blue)}
.pmark.dt{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--amber)}
.pmark.wx{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green)}
.pmark.qq{background:color-mix(in srgb,var(--violet) 22%,transparent);color:var(--violet)}
.pmark.q {background:var(--panel-2);color:var(--ink-3)}

/* ---------- 内容 ---------- */
.wrap{padding:22px 26px 60px;max-width:1180px}
h2{font-size:17px;margin:0 0 3px;font-weight:600}
.sub{color:var(--ink-3);font-size:12px;margin-bottom:18px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(272px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 16px;
}
.card h3{
  font-size:12px;margin:0 0 12px;color:var(--ink-3);font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:7px;
}
.kv{display:flex;justify-content:space-between;gap:14px;padding:3.5px 0;font-size:12.5px}
.kv span:first-child{color:var(--ink-3);flex:none}
.kv span:last-child{text-align:right;overflow-wrap:anywhere;font-family:var(--mono);
  font-size:11.5px}
.big{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.unit{font-size:12px;color:var(--ink-3);font-weight:400}

.statrow{display:flex;gap:22px;flex-wrap:wrap}
.stat .big{font-size:22px}
.stat .lbl{font-size:11px;color:var(--ink-3)}

/* 余额条 */
.bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;margin:6px 0 3px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--green);transition:width .4s}
.bar i.warn{background:var(--amber)} .bar i.hot{background:var(--coral)}
.bal-item{margin-bottom:14px}
.bal-item .top{display:flex;justify-content:baseline;align-items:baseline;gap:8px}
.bal-item .top b{font-size:13px;font-weight:600}
.bal-item .top .amt{margin-left:auto;font-family:var(--mono);font-size:13px}

svg.chart{width:100%;height:180px;display:block;overflow:visible}
.legend{display:flex;gap:14px;font-size:11px;color:var(--ink-3);margin-top:8px}
.legend i{display:inline-block;width:9px;height:2.5px;vertical-align:middle;margin-right:5px;
  border-radius:2px}

/* 进程卡 */
.proc .head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.proc .head b{font-size:14px}
.proc .state{margin-left:auto;font-size:11px;font-family:var(--mono)}
.up{color:var(--green)} .warn{color:var(--amber)} .down{color:var(--red)} .off{color:var(--ink-3)}
.health-note{
  margin:-2px 0 9px;padding:6px 9px;border-radius:7px;font-size:11.5px;
  color:var(--amber);background:color-mix(in srgb,var(--amber) 10%,transparent);
}
.ports{margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.port{
  display:inline-block;font-family:var(--mono);font-size:10.5px;padding:2px 6px;
  border-radius:5px;background:var(--panel-2);margin:2px 3px 0 0;color:var(--ink-2);
}
.port.listen{color:var(--coral);background:color-mix(in srgb,var(--coral) 13%,transparent)}
.logline{
  font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:9px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
details.logs{margin-top:9px}
details.logs summary{font-size:11px;color:var(--ink-3);cursor:pointer;user-select:none}
pre.log{
  margin:8px 0 0;padding:10px;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;max-height:280px;overflow:auto;font-family:var(--mono);
  font-size:10.5px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap;
  overflow-wrap:anywhere;
}

/* ---------- 聊天 ---------- */
.chathead{
  position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:14px 26px 12px;z-index:5;border-top:3px solid var(--ink-3);
}
.chathead.tg{border-top-color:var(--blue)}
.chathead.dt{border-top-color:var(--amber)}
.chathead.wx{border-top-color:var(--green)}
.chathead.qq{border-top-color:var(--violet)}
.chathead .t{display:flex;align-items:center;gap:10px}
.chathead h2{margin:0}
.chathead .who{min-width:0}
.chathead .platline{
  display:flex;align-items:center;gap:6px;margin-top:2px;
  font-size:12px;color:var(--ink-2);
}
.avatar{
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:600;flex:none;
}
.avatar.tg{background:color-mix(in srgb,var(--blue) 20%,transparent);color:var(--blue)}
.avatar.dt{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
.avatar.wx{background:color-mix(in srgb,var(--green) 20%,transparent);color:var(--green)}
.avatar.qq{background:color-mix(in srgb,var(--violet) 20%,transparent);color:var(--violet)}
.avatar.q {background:var(--panel-2);color:var(--ink-3)}
.msg.bot.tg .bub{border-left:2px solid color-mix(in srgb,var(--blue) 55%,transparent)}
.msg.bot.dt .bub{border-left:2px solid color-mix(in srgb,var(--amber) 55%,transparent)}
.msg.bot.wx .bub{border-left:2px solid color-mix(in srgb,var(--green) 55%,transparent)}
.msg.bot.qq .bub{border-left:2px solid color-mix(in srgb,var(--violet) 55%,transparent)}
.platbanner{
  display:flex;align-items:center;gap:8px;margin:0 0 16px;padding:8px 12px;
  border-radius:9px;background:var(--panel);border:1px solid var(--line);
  font-size:12.5px;color:var(--ink-2);
}
.platbanner.tg{border-color:color-mix(in srgb,var(--blue) 35%,var(--line))}
.platbanner.dt{border-color:color-mix(in srgb,var(--amber) 35%,var(--line))}
.platbanner.wx{border-color:color-mix(in srgb,var(--green) 35%,var(--line))}
.platbanner.qq{border-color:color-mix(in srgb,var(--violet) 35%,var(--line))}
.tabs{display:flex;gap:4px;margin-top:11px}
.tab{
  padding:5px 12px;border-radius:7px;background:none;border:1px solid transparent;
  color:var(--ink-3);font:inherit;font-size:12.5px;cursor:pointer;
}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--panel);border-color:var(--line);color:var(--ink)}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);margin-top:7px;
  font-family:var(--mono)}

.stream{padding:20px 26px 70px;max-width:760px}
.daysep{
  text-align:center;font-size:10.5px;color:var(--ink-3);margin:20px 0 14px;
  font-family:var(--mono);
}
/* 会话分界。同一个人的单聊和群聊被合成一条时间线了，
   但记忆是分开的——这条线就是那个分界，不能画得太轻。 */
.ctxsep{
  display:flex;align-items:center;gap:9px;margin:14px 0 11px;
  font-size:10.5px;color:var(--ink-3);font-family:var(--mono);
}
.ctxsep::before,.ctxsep::after{
  content:"";flex:1;height:1px;background:var(--line);
}
.msg{display:flex;margin-bottom:9px;gap:9px}
.msg.user{justify-content:flex-end}
.bub{
  max-width:76%;padding:9px 13px;border-radius:15px;font-size:13.5px;line-height:1.62;
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.msg.bot .bub{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.user .bub{background:var(--coral);color:#fff;border-bottom-right-radius:5px}
.msg .time{
  font-size:9.5px;color:var(--ink-3);align-self:flex-end;padding-bottom:5px;flex:none;
  font-family:var(--mono);opacity:0;transition:opacity .15s;
}
.msg:hover .time{opacity:1}
.bub.quiet{
  background:none;border:1px dashed var(--line);color:var(--ink-3);font-size:12px;
  font-style:italic;
}
.scene{
  font-size:11px;color:var(--ink-3);margin:2px 0 9px;padding-left:2px;
  display:flex;justify-content:flex-end;gap:5px;
}
.msg.bot + .scene{justify-content:flex-start}
.photo{
  display:block;font-size:11px;opacity:.85;margin:4px 0 2px;color:var(--ink-3);
}
.shot{
  display:block;max-width:100%;max-height:280px;border-radius:10px;
  margin-bottom:6px;object-fit:cover;
}
.badge-intent{
  font-size:9.5px;font-family:var(--mono);color:var(--coral);
  background:color-mix(in srgb,var(--coral) 12%,transparent);
  padding:1px 6px;border-radius:5px;margin-bottom:4px;display:inline-block;
}

/* ---------- 记忆 ---------- */
.memblock{margin-bottom:16px}
.memblock .bh{display:flex;align-items:baseline;gap:9px;margin-bottom:5px}
.memblock .bh b{font-size:13.5px}
.memblock .bh .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.memblock .body{
  background:var(--panel-2);border-radius:9px;padding:11px 13px;font-size:13px;
  line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;
}
.memblock .hint{font-size:11px;color:var(--ink-3);margin-bottom:6px}
.empty{color:var(--ink-3);font-style:italic}
.note{
  background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--coral);
  border-radius:8px;padding:10px 13px;font-size:12px;color:var(--ink-2);margin-bottom:16px;
}
.err{color:var(--red);font-size:12.5px}

/* 手机上侧栏不能继续吃掉 300px：收成一个可滚动的联系人区。 */
@media (max-width:760px){
  html,body{height:auto;min-height:100%}
  #app{display:block;height:auto;min-height:100vh}
  aside{display:block;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:12px 14px 8px}
  .pills{padding:0 14px 8px}
  .navbtn{display:inline-block;width:auto;margin:0 2px 8px 10px;padding:6px 9px}
  .seclabel{padding:8px 14px 6px}
  .filters,.search{padding-left:14px;padding-right:14px}
  .people{max-height:230px;overflow-y:auto;padding-bottom:8px}
  .plathead{padding-left:14px;padding-right:14px}
  .person{width:calc(100% - 28px);margin-left:14px;margin-right:14px}
  main{min-height:40vh;overflow:visible}
  .wrap{padding:16px 14px 42px}
  .stream{padding:16px 14px 42px}
  .chathead{position:static;padding:12px 14px 10px}
  .g2{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr}
  .statrow{gap:14px}
  .bub{max-width:84%}
  .meta{gap:7px 12px}
}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand">
      <img src="/mark.svg" alt="">
      <h1>Murmur</h1>
      <span class="tick" id="tick">···</span>
    </div>
    <div class="pills" id="pills"></div>
    <button class="navbtn on" data-view="overview">总览</button>
    <button class="navbtn" data-view="balance">余额变化</button>
    <a class="navbtn" id="vps-link" href="/vps">VPS 面板 ↗</a>
    <div class="seclabel"><span>聊天窗口</span><span id="pcount"></span></div>
    <div class="filters" id="filters"></div>
    <div class="search"><input id="person-search" type="search" placeholder="搜索昵称、ID 或最近消息" autocomplete="off"></div>
    <div class="people" id="people"></div>
  </aside>
  <main id="main"><div class="wrap"><p class="dim">加载中…</p></div></main>
</div>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c;
  if(txt!=null)e.textContent=txt; return e;};
const esc = s => (s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const PLAT = {
  tg:{name:'Telegram', short:'TG', mark:'TG'},
  dt:{name:'钉钉', short:'钉钉', mark:'钉'},
  wx:{name:'微信', short:'微信', mark:'微'},
  qq:{name:'QQ', short:'QQ', mark:'Q'},
  '?':{name:'其他', short:'其他', mark:'?'}
};
const PLAT_ORDER = ['wx','qq','dt','tg','?'];
// 用 ?token= 打开远程看板时，后续 API 和照片请求也得带回 token；
// 否则首页能开、页面里的 fetch 却全是 401。
const WEB_TOKEN = new URLSearchParams(location.search).get('token');
if (WEB_TOKEN) $('#vps-link').href = '/vps?token=' + encodeURIComponent(WEB_TOKEN);

let state = {view:'overview', person:null, ctx:null, tab:'chat', platFilter:null, query:'', data:{}, sig:null};

function platOf(p){ return PLAT[p] || PLAT['?']; }
function platCls(p){ return ['tg','dt','wx','qq'].includes(p) ? p : 'q'; }
function shortName(p){
  const n = p.nick || p.name || '';
  if(p.nick) return p.nick;
  if(p.platform==='wx' && /@im\.wechat$/.test(n)) return n.slice(0,10)+'…';
  if(n.length>18) return n.slice(0,8)+'…'+n.slice(-4);
  return n;
}

/* ---------- 工具 ---------- */
function parseAt(iso){
  if(!iso) return new Date(NaN);
  if(/Z$|[+-]\d\d:\d\d$/.test(iso)) return new Date(iso);
  return new Date(iso+'Z');
}
function ago(iso){
  if(!iso) return '—';
  const s = (Date.now() - parseAt(iso))/1000;
  if(s < 60) return '刚刚';
  if(s < 3600) return Math.floor(s/60)+' 分钟前';
  if(s < 86400) return Math.floor(s/3600)+' 小时前';
  return Math.floor(s/86400)+' 天前';
}
function clock(iso){
  if(!iso) return '';
  const d = parseAt(iso);
  if(Number.isNaN(+d)) return '';
  return d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}
function day(iso){
  const d = parseAt(iso);
  if(Number.isNaN(+d)) return '';
  return d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});
}
function dur(s){
  if(s==null) return '—';
  const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  if(d) return `${d} 天 ${h} 小时`;
  if(h) return `${h} 小时 ${m} 分`;
  return `${m} 分钟`;
}
function bytes(n){
  if(!n) return '0';
  const u=['B','KB','MB','GB']; let i=0;
  while(n>=1024 && i<u.length-1){n/=1024;i++;}
  return n.toFixed(i?1:0)+' '+u[i];
}
function apiUrl(p){
  if(!WEB_TOKEN) return p;
  const u = new URL(p, location.origin);
  u.searchParams.set('token', WEB_TOKEN);
  return u.pathname + u.search;
}
async function get(p){
  const r = await fetch(apiUrl(p));
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

/* ---------- 侧栏 ---------- */
function renderPills(d){
  const box = $('#pills'); box.innerHTML='';
  d.platforms.forEach(p=>{
    const cls = healthClass(p);
    const pill = el('span','pill');
    pill.append(el('i','dot '+cls), document.createTextNode(p.label));
    pill.title = p.health?.reasons?.length
      ? p.health.reasons.join('；')
      : (!p.configured ? p.why : (p.running
        ? `PID ${p.instances.map(i=>i.pid).join(', ')} · 已跑 ${dur(p.instances[0].uptime_s)}`
        : '进程不在'));
    box.append(pill);
  });
  const m = el('span','pill');
  m.append(el('i','dot up'), document.createTextNode(d.model.name));
  m.title = d.model.base_url;
  box.append(m);
  $('#tick').textContent = clock(d.now);
}

function healthClass(p){
  const level = p.health?.level;
  if(level==='healthy') return 'up';
  if(level==='degraded') return 'warn';
  if(level==='down') return 'down';
  return 'off';
}

function renderFilters(people){
  const box = $('#filters'); box.innerHTML='';
  const counts = {};
  people.forEach(p=>{ counts[p.platform] = (counts[p.platform]||0)+1; });
  const add = (k, label)=>{
    const n = k==null ? people.length : (counts[k]||0);
    if(k && !n) return;
    const on = state.platFilter===k || (k==null && !state.platFilter);
    const b = el('button','fchip'+(on?' on':'')+(k?(' '+k):''), label+' '+n);
    b.onclick = ()=>{ state.platFilter = (k && state.platFilter===k) ? null : k; refresh(); };
    box.append(b);
  };
  add(null,'全部');
  add('wx','微信'); add('qq','QQ'); add('dt','钉钉'); add('tg','Telegram');
  if(counts['?']) add('?','其他');
}

function renderPeople(people){
  const box = $('#people'); box.innerHTML='';
  const term = state.query.trim().toLocaleLowerCase();
  const shown = people.filter(p=>{
    const platformMatches = !state.platFilter || p.platform===state.platFilter;
    const haystack = [p.name,p.nick,p.user_id,p.preview].join(' ').toLocaleLowerCase();
    return platformMatches && (!term || haystack.includes(term));
  });
  $('#pcount').textContent = shown.length===people.length
    ? String(people.length) : shown.length+' / '+people.length;
  const groups = {wx:[], qq:[], dt:[], tg:[], '?':[]};
  shown.forEach(p=>(groups[p.platform]||groups['?']).push(p));
  if(!shown.length){
    box.append(el('div','dimmer', term?'没有匹配的聊天窗口。':(state.platFilter?'这个平台还没有聊天窗口。':'还没有聊天窗口。')));
    return;
  }
  PLAT_ORDER.forEach(k=>{
    const list = groups[k]||[];
    if(!list.length) return;
    const h = el('div','plathead');
    h.append(el('span','pmark '+platCls(k), platOf(k).mark));
    h.append(el('span',null, platOf(k).name));
    h.append(el('span','cnt', String(list.length)));
    box.append(h);
    list.forEach(p=>{
      const b = el('button','person '+platCls(p.platform)+(state.person===p.key?' on':''));
      const r1 = el('div','row1');
      r1.append(el('span','tag '+platCls(p.platform), platOf(p.platform).short));
      r1.append(el('span','name', shortName(p)));
      if(p.contexts.length>1) r1.append(el('span','tag q', p.contexts.length+' 会话'));
      if(p.initiative_state==='hold') r1.append(el('span','tag hold','已冷却'));
      else if(p.initiative_state==='watch') r1.append(el('span','tag watch','留意'));
      r1.append(el('span','when', p.last_at?ago(p.last_at).replace(/ /g,''):'—'));
      b.append(r1);
      b.append(el('div','prev', (p.opted_out?'已退出 · ':'') + (p.preview||'')));
      b.title = platOf(p.platform).name+' · '+(p.name||'');
      b.onclick = ()=>{ state.view='chat'; state.person=p.key; state.tab='chat';
                        state.ctx=null;
                        document.querySelectorAll('.navbtn').forEach(n=>n.classList.remove('on'));
                        refresh(); };
      box.append(b);
    });
  });
}

/* ---------- 总览 ---------- */
function procCard(p){
  const c = el('div','card proc');
  const h = el('div','head');
  const cls = healthClass(p);
  h.append(el('i','dot '+cls), el('b',null,p.label));
  h.append(el('span','state '+cls, p.health?.label || '—'));
  c.append(h);

  if(p.health?.reasons?.length){
    c.append(el('div','health-note', p.health.reasons.join(' · ')));
  }

  if(!p.configured){
    c.append(el('div','dim', p.why));
  } else if(!p.running){
    c.append(el('div','err','进程不在。run.sh 会自动拉起；一直不起就看日志。'));
  }

  p.instances.forEach(i=>{
    c.append(kv('PID', i.pid));
    c.append(kv('已运行', dur(i.uptime_s)));
    c.append(kv('内存 / CPU', `${i.rss_mb} MB · ${i.cpu}%`));
    const s = i.sockets||{};
    const ports = el('div','ports');
    const lab = el('div','kv');
    lab.append(el('span',null,'端口'));
    lab.append(el('span','dimmer',
      (s.listen&&s.listen.length)?'':'不监听端口（长轮询 / websocket 主动连出）'));
    ports.append(lab);
    (s.listen||[]).forEach(a=>ports.append(el('span','port listen','监听 '+a)));
    (s.outbound||[]).slice(0,6).forEach(a=>ports.append(el('span','port','→ '+a)));
    if(s.note) ports.append(el('span','port',s.note));
    c.append(ports);
  });

  const lg = p.log||{};
  if(lg.exists){
    c.append(kv('24 小时内重启', lg.restarts_24h ?? 0));
    c.append(kv('日志更新', ago(lg.mtime)));
    if(lg.last_line) c.append(el('div','logline', lg.last_line));
    const d = el('details','logs');
    d.append(el('summary',null,'查看日志尾巴'));
    const pre = el('pre','log','点开加载…');
    d.append(pre);
    d.ontoggle = async ()=>{
      if(!d.open) return;
      try{
        const r = await get('/api/logs?name='+p.kind+'&n=200');
        pre.textContent = r.lines.join('\n') || '（空）';
        pre.scrollTop = pre.scrollHeight;
      }catch(e){ pre.textContent = '读不到：'+e.message; }
    };
    c.append(d);
  } else {
    c.append(el('div','dimmer','没有日志文件（可能不是 run.sh 启动的）'));
  }
  return c;
}

function kv(k,v){
  const d = el('div','kv'); d.append(el('span',null,k), el('span',null,String(v)));
  return d;
}

// 余额是"还剩多少"，方向和原来的额度百分比是反的：跌到 0 才是要出事，
// 所以告警色也反过来——少了才红。阈值是拍脑袋的量级判断，不是账单规则。
const BAL_HOT = 10, BAL_WARN = 50;

function money(v, cur){
  if(v==null) return '—';
  return (cur==='USD'?'$':'¥') + Number(v).toFixed(2);
}

function balanceCard(q){
  const c = el('div','card');
  c.append(el('h3',null,'DeepSeek 余额'));
  if(!q){ c.append(el('div','dim','还没采到。每 5 分钟采一次，稍等。')); return c; }
  if(!q.ok){ c.append(el('div','err','取不到：'+(q.detail||'未知'))); return c; }

  const cur = q.currency;
  const it = el('div','bal-item');
  const top = el('div','top');
  top.append(el('b',null,'账户总额'));
  top.append(el('span','amt', money(q.total, cur)));
  it.append(top);
  // 条形按 BAL_WARN 满格：余额没有上限，画"占额度多少"没有意义，
  // 这根条只是让"快没了"一眼看得见。
  const bar = el('div','bar');
  const i = el('i');
  const t = Number(q.total)||0;
  i.style.width = Math.min(100, Math.max(1.5, t/BAL_WARN*100))+'%';
  if(t < BAL_HOT) i.className='hot'; else if(t < BAL_WARN) i.className='warn';
  bar.append(i); it.append(bar);
  c.append(it);

  [['granted','赠送'],['topped_up','充值']].forEach(([k,label])=>{
    if(q[k]==null) return;
    c.append(kv(label, money(q[k], cur)));
  });
  if(q.available===0) c.append(el('div','err','官方标记余额不足，调用会被拒'));
  c.append(el('div','dimmer','采样于 '+ago(q.at)+' · 值没变就不记新点'));
  return c;
}

function renderOverview(d){
  const w = el('div','wrap');
  w.append(el('h2',null,'总览'));
  w.append(el('div','sub',
    `${d.today} · ${d.tz} · 今天他说了 ${d.stats.today_in} 次，它主动说了 ${d.stats.today_out} 次`));

  const stats = el('div','card');
  const row = el('div','statrow');
  [['认识的人',d.stats.people],['活跃会话（今天）',d.stats.active_today],
   ['记录总数',d.stats.entries],['已退出',d.stats.optouts]].forEach(([l,v])=>{
    const s = el('div','stat'); s.append(el('div','big',String(v)), el('div','lbl',l));
    row.append(s);
  });
  stats.append(row);
  const by = d.stats.by_platform||{};
  if(Object.keys(by).length){
    const plats = el('div','statrow'); plats.style.marginTop='14px';
    PLAT_ORDER.forEach(k=>{
      if(by[k]==null) return;
      const s = el('div','stat');
      const lab = el('div','lbl');
      lab.append(el('span','tag '+platCls(k), platOf(k).name));
      s.append(el('div','big',String(by[k])), lab);
      plats.append(s);
    });
    stats.append(plats);
  }
  w.append(stats);

  // 回复质量计数：服务端只记分类和次数（counters.py），不含任何正文，
  // 是 P0 生产验收的数据源。
  const COUNTER_LABELS = {
    'respond.full_output':'回复 · 完整输出',
    'respond.salvaged_output':'回复 · 截断抢救',
    'respond.quiet_output':'回复 · 选择安静',
    'initiate.full_output':'主动 · 完整输出',
    'initiate.salvaged_output':'主动 · 截断抢救',
    'app_moment.retryable_failure':'可重试失败',
    'dossier.full_saved':'记忆整理 · 完整',
    'dossier.partial_saved':'记忆整理 · 部分',
    'dossier.no_usable_blocks':'记忆整理 · 失败',
  };
  const cntCard = el('div','card');
  cntCard.append(el('h3',null,'回复质量 · 近 14 天'));
  const agg = {};
  (d.counters||[]).forEach(r=>{
    const a = agg[r.key] = agg[r.key]||{today:0,total:0};
    a.total += r.count;
    if(r.day===d.today) a.today += r.count;
  });
  const cntKeys = Object.keys(COUNTER_LABELS).filter(k=>agg[k]);
  if(!cntKeys.length){
    cntCard.append(el('div','sub','还没有计数——升级后随每次回复开始积累。'));
  }else{
    cntKeys.forEach(k=>cntCard.append(
      kv(COUNTER_LABELS[k], `今天 ${agg[k].today} · 14 天 ${agg[k].total}`)));
  }
  w.append(cntCard);

  const g1 = el('div','grid g3');
  g1.style.marginTop='14px';
  d.platforms.forEach(p=>g1.append(procCard(p)));
  w.append(g1);

  const g2 = el('div','grid g2'); g2.style.marginTop='14px';
  g2.append(balanceCard(d.balance));

  const m = el('div','card');
  m.append(el('h3',null,'模型与配置'));
  m.append(kv('正在用的模型', d.model.name));
  m.append(kv('接口', d.model.base_url));
  m.append(kv('API key', d.model.key_set?'已配置':'没配'));
  m.append(kv('时区', d.tz));
  m.append(kv('数据库', d.settings.db_path+' · '+bytes(d.settings.db_size)));
  m.append(kv('记忆文件目录', d.settings.dossier_dir));
  m.append(kv('日志目录', d.settings.log_dir));
  m.append(kv('新人自动入册', d.settings.auto_enroll?'开':'关'));
  m.append(kv('微信主动消息', d.settings.wechat_initiative?'开':'关（建议）'));
  m.append(kv('QQ 沙箱', d.settings.qq_sandbox?'开':'关'));
  g2.append(m);
  w.append(g2);
  return w;
}

/* ---------- 余额图 ---------- */
function chart(points, keys, unit){
  unit = unit || '';
  const NS='http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('class','chart');
  const W=1000, H=180, pad={l:44,r:16,t:14,b:28};
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  const usable = (points||[]).filter(p=>p && p.ok && parseAt(p.at) && !Number.isNaN(+parseAt(p.at)));
  if(usable.length < 2){
    const t = document.createElementNS(NS,'text');
    t.setAttribute('x',W/2); t.setAttribute('y',H/2);
    t.setAttribute('text-anchor','middle'); t.setAttribute('fill','currentColor');
    t.setAttribute('fill-opacity','.45'); t.setAttribute('font-size','14');
    t.textContent = '数据点还不够画线（看板每 5 分钟采一次，跑一会儿就有了）';
    svg.append(t); return svg;
  }
  const t0 = +parseAt(usable[0].at), t1 = +parseAt(usable[usable.length-1].at);
  const span = Math.max(1, t1-t0);
  const x = p => pad.l + (parseAt(p.at)-t0)/span*(W-pad.l-pad.r);

  // 原来纵轴钉死 0–100（百分比）。余额没有上限，得按数据自适应——
  // 但**下沿始终留在 0**：余额图要回答的是"离见底还有多远"，浮动基线
  // 会把 100 块掉到 90 块画成一次悬崖。
  const all = [];
  keys.forEach(({k})=>usable.forEach(p=>{
    const v = Number(p[k]);
    if(p[k]!=null && !Number.isNaN(v)) all.push(v);
  }));
  const top = Math.max(1, ...all);
  const y = v => pad.t + (1 - Math.min(top, Math.max(0, Number(v)||0))/top)*(H-pad.t-pad.b);

  [0, top/2, top].forEach(v=>{
    const ln = document.createElementNS(NS,'line');
    ln.setAttribute('x1',pad.l); ln.setAttribute('x2',W-pad.r);
    ln.setAttribute('y1',y(v)); ln.setAttribute('y2',y(v));
    ln.setAttribute('stroke','currentColor'); ln.setAttribute('stroke-opacity','.12');
    svg.append(ln);
    const t = document.createElementNS(NS,'text');
    t.setAttribute('x',pad.l-8); t.setAttribute('y',y(v)+4);
    t.setAttribute('text-anchor','end');
    t.setAttribute('fill','currentColor'); t.setAttribute('fill-opacity','.4');
    t.setAttribute('font-size','11');
    t.textContent = unit + (v>=100 ? v.toFixed(0) : v.toFixed(1));
    svg.append(t);
  });

  keys.forEach(({k,color})=>{
    const pts = usable.filter(p=>p[k]!=null && !Number.isNaN(Number(p[k])));
    if(!pts.length) return;
    const d = pts.map((p,i)=>(i?'L':'M')+x(p).toFixed(1)+' '+y(p[k]).toFixed(1)).join(' ');
    const path = document.createElementNS(NS,'path');
    path.setAttribute('d', d);
    path.setAttribute('fill','none'); path.setAttribute('stroke',color);
    path.setAttribute('stroke-width','2'); path.setAttribute('stroke-linejoin','round');
    path.setAttribute('stroke-linecap','round');
    svg.append(path);
    pts.forEach(p=>{
      const c = document.createElementNS(NS,'circle');
      c.setAttribute('cx', x(p).toFixed(1));
      c.setAttribute('cy', y(p[k]).toFixed(1));
      c.setAttribute('r','3.2');
      c.setAttribute('fill',color);
      svg.append(c);
    });
  });

  [[parseAt(usable[0].at),pad.l,'start'],
   [parseAt(usable[usable.length-1].at),W-pad.r,'end']].forEach(([d,px,anchor])=>{
    const t = document.createElementNS(NS,'text');
    t.setAttribute('x',px); t.setAttribute('y',H-8); t.setAttribute('text-anchor',anchor);
    t.setAttribute('fill','currentColor'); t.setAttribute('fill-opacity','.4');
    t.setAttribute('font-size','11');
    t.textContent = d.toLocaleString('zh-CN',{month:'numeric',day:'numeric',
      hour:'2-digit',minute:'2-digit'});
    svg.append(t);
  });
  return svg;
}

/* ---------- 聊天 ---------- */
function renderPerson(p){
  const box = el('div');
  const pc = platCls(p.platform);
  const head = el('div','chathead '+pc);
  const line = el('div','t');
  line.append(el('div','avatar '+pc, platOf(p.platform).mark));
  const who = el('div','who');
  const title = el('div','t'); title.style.gap='8px';
  title.append(el('h2',null, shortName(p)));
  if(p.opted_out) title.append(el('span','tag q','已退出'));
  if(!p.in_roster) title.append(el('span','tag q','不在名册'));
  who.append(title);
  const platline = el('div','platline');
  platline.append(el('span','tag '+pc, platOf(p.platform).name));
  const kinds = [...new Set(p.contexts.map(c=>c.conv_label))];
  platline.append(el('span',null, kinds.join(' · ')));
  who.append(platline);
  line.append(who);
  head.append(line);
  const meta = el('div','meta');
  [['用户 id', p.user_id],
   ['会话', p.contexts.length+' 条'],
   ['记忆文件', p.dossiers+' 份'],
   ['消息', p.total+' 条（它主动 '+p.outbound+'）'],
   ['主动节奏', p.initiative_note],
   ['打过招呼', p.greeted?'是':'否']
  ].forEach(([k,v])=>meta.append(el('span',null,k+' '+v)));
  head.append(meta);

  const tabs = el('div','tabs');
  [['chat','聊天'],['mem','记忆文档 '+p.dossiers],['raw','原始记录']].forEach(([k,label])=>{
    const b = el('button','tab'+(state.tab===k?' on':''), label);
    b.onclick = ()=>{ state.tab=k; refresh(); };
    tabs.append(b);
  });
  head.append(tabs);

  // 一个人有多条上下文时，可以只看其中一条
  if(p.contexts.length>1 && state.tab==='chat'){
    const f = el('div','tabs'); f.style.marginTop='6px';
    const mk=(key,label)=>{
      const b = el('button','tab'+((state.ctx===key||(!state.ctx&&key===null))?' on':''),label);
      b.style.fontSize='11.5px';
      b.onclick = ()=>{ state.ctx=key; refresh(); };
      return b;
    };
    f.append(mk(null,'全部'));
    p.contexts.forEach(c=>f.append(mk(c.chat_id,
      platOf(c.platform||p.platform).short+' · '+c.conv_label+' '+c.total)));
    head.append(f);
  }
  box.append(head);

  if(state.tab==='chat') box.append(chatStream(p));
  else if(state.tab==='mem') box.append(memView(p));
  else box.append(rawView(p));
  return box;
}

function chatStream(p){
  const s = el('div','stream');
  const pc = platCls(p.platform);
  const banner = el('div','platbanner '+pc);
  banner.append(el('span','pmark '+pc, platOf(p.platform).mark));
  banner.append(el('span',null,
    platOf(p.platform).name+' · '+(p.contexts.length>1
      ? p.contexts.length+' 条会话'
      : (p.contexts[0]&&p.contexts[0].conv_label)||'单聊')));
  s.append(banner);
  const msgs = state.ctx ? p.messages.filter(m=>m.chat_id===state.ctx) : p.messages;
  if(p.contexts.length>1 && !state.ctx){
    s.append(el('div','note',
      `这个人在 ${p.contexts.length} 条会话里出现过（单聊、群、或者换了组织的 id），`
      + `下面按时间合在一起了。但 Murmur 自己是一条会话一份记忆——`
      + `群里说的话不会串进单聊，所以分界线要看清楚。`));
  }
  if(!msgs.length){ s.append(el('p','dim','还没有消息。')); return s; }
  let lastDay = '', lastCtx = null;
  msgs.forEach(m=>{
    const d = day(m.at);
    if(d!==lastDay){ s.append(el('div','daysep',d)); lastDay=d; lastCtx=null; }
    if(p.contexts.length>1 && m.chat_id!==lastCtx){
      s.append(el('div','ctxsep',
        platOf(m.platform||p.platform).name+' · '+(m.conv_label||'')));
      lastCtx = m.chat_id;
    }
    const row = el('div','msg '+m.side+' '+platCls(m.platform||p.platform));
    const bub = el('div','bub'+(m.quiet?' quiet':''));
    if(m.intent) bub.append(el('div','badge-intent','主动 · '+m.intent));
    if(m.photo){
      if(m.photo_url){
        const img = document.createElement('img');
        img.className = 'shot';
        img.src = apiUrl(m.photo_url);
        img.alt = m.scene || '图';
        img.onerror = ()=>{ img.remove(); };
        bub.append(img);
      }
      bub.append(el('div','photo',
        (m.scene ? m.scene : '发了一张图')
        + (m.shot_at ? ' · '+clock(m.shot_at) : '')));
    }
    if(!m.photo || m.text){
      bub.append(document.createTextNode(m.quiet ? '（它选择了不说话）' : (m.text||'')));
    }
    if(m.side==='user'){ row.append(el('span','time',clock(m.at)), bub); }
    else { row.append(bub, el('span','time',clock(m.at))); }
    s.append(row);
    if(m.scene && !m.photo){
      const sc = el('div','scene');
      sc.append(el('span','dimmer','它看到的：'+m.scene));
      s.append(sc);
    }
  });
  return s;
}

function memView(p){
  const w = el('div','wrap'); w.style.maxWidth='760px';
  if(p.contexts.length>1){
    w.append(el('div','note',
      `这个人有 ${p.contexts.length} 条会话，每条一份独立的记忆——`
      + `它在群里认识的那个"他"和单聊里的不是同一份记忆。`));
  }
  p.contexts.forEach(c=>{
    if(p.contexts.length>1){
      const h = el('h2',null, platOf(c.platform||p.platform).name+' · '+c.conv_label);
      h.style.margin='22px 0 8px'; h.style.fontSize='14px';
      w.append(h);
    }
    w.append(dossierView(c.dossier));
  });
  return w;
}

function dossierView(d){
  const w = el('div');
  if(!d || !d.exists){
    w.append(el('div','note','还没有记忆文件。聊够 '+
      ((d&&d.refresh_every)||12)+' 条它会自己建一份。'));
    return w;
  }
  const n = el('div','note');
  n.textContent = `${d.path}\n上次整理：${d.updated_at?ago(d.updated_at):'从未'} · `
    + `已消化到第 ${d.covered_upto} 条 · 还有 ${d.pending} 条没整理`
    + `（攒够 ${d.refresh_every} 条自动整理一次）`;
  n.style.whiteSpace='pre-wrap';
  w.append(n);
  (d.blocks||[]).forEach(b=>{
    const blk = el('div','memblock');
    const bh = el('div','bh');
    bh.append(el('b',null,b.name));
    bh.append(el('span','cnt', b.used+' / '+b.limit+' 字'));
    blk.append(bh);
    blk.append(el('div','hint', b.hint));
    const body = el('div','body');
    if(!b.body || b.body==='（还不知道）'){
      body.append(el('span','empty','（还不知道）'));
    } else body.textContent = b.body;
    blk.append(body);
    w.append(blk);
  });
  const det = el('details','logs');
  det.append(el('summary',null,'看文件原文'));
  det.append(el('pre','log', d.raw||''));
  w.append(det);
  return w;
}

function rawView(p){
  const w = el('div','wrap'); w.style.maxWidth='900px';
  w.append(el('div','note','排查"它为什么这么说"时用。会话是 Murmur 内部的划分单位：'
    + '(平台, 会话, 发送人) 三者算出一个 chat_id，记忆和上下文都按它隔离。'));
  p.contexts.forEach(c=>{
    const t = el('div','memblock');
    const bh = el('div','bh');
      bh.append(el('b',null, platOf(c.platform||p.platform).name+' · '+c.conv_label));
    bh.append(el('span','cnt', c.total+' 条 · chat_id '+c.chat_id));
    t.append(bh);
    t.append(el('div','hint', 'thread: '+(c.thread||'（早期记录，没存 thread）')));
    w.append(t);
  });
  const pre = el('pre','log');
  pre.style.maxHeight='none';
  pre.textContent = JSON.stringify(p.messages, null, 2);
  w.append(pre);
  return w;
}

/* ---------- 主循环 ---------- */
async function refresh(){
  try{
    const [ov, pl] = await Promise.all([get('/api/overview'), get('/api/people')]);
    state.data = {ov, pl};
    renderPills(ov);
    renderFilters(pl.people);
    renderPeople(pl.people);
    const main = $('#main');
    const y = main.scrollTop;
    // 聊天窗口默认停在最新一条。但如果人正翻着旧消息，15 秒一次的自动刷新
    // 就不该把他拽回底部——只有本来就贴着底的时候才跟着走。
    const atBottom = main.scrollHeight - y - main.clientHeight < 80;
    const sig = [state.view, state.person, state.tab, state.ctx, state.platFilter].join('|');
    const switched = sig !== state.sig;
    state.sig = sig;
    main.innerHTML='';
    if(state.view==='overview') main.append(renderOverview(ov));
    else if(state.view==='balance') main.append(await renderBalance());
    else {
      const p = await get('/api/person?key='+encodeURIComponent(state.person));
      if(p.error) main.append(el('div','wrap', p.error));
      else main.append(renderPerson(p));
    }
    const toBottom = state.view==='chat' && state.tab==='chat' && (switched || atBottom);
    main.scrollTop = toBottom ? main.scrollHeight : (switched ? 0 : y);
  }catch(e){
    $('#main').innerHTML = '<div class="wrap"><p class="err">看板连不上后端：'
      + esc(e.message) + '</p></div>';
  }
}

document.querySelectorAll('button.navbtn').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.navbtn').forEach(n=>n.classList.remove('on'));
    b.classList.add('on');
    state.view = b.dataset.view; state.person=null; state.ctx=null; refresh();
  };
});

$('#person-search').addEventListener('input', e=>{
  state.query = e.target.value;
  if(state.data.pl?.people) renderPeople(state.data.pl.people);
});

refresh();
setInterval(refresh, 15000);
</script>

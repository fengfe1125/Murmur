[project]
name = "murmur"
version = "0.2.0"
description = "以照片和讲述为入口的私人回忆与日记应用。"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",              # DeepSeek 是 OpenAI 兼容接口
    "python-telegram-bot>=21.6",
    "dingtalk-stream>=0.20",
    "pillow>=11.0",
    "pillow-heif>=0.20",         # iPhone 的 .HEIC
    "python-dotenv>=1.0",
    "requests>=2.31",            # 钉钉 / 微信 / QQ 的 HTTP 调用
    "cryptography>=42.0",        # 微信 CDN 的图是 AES-128-ECB 加密的
    "qq-botpy>=1.2",             # QQ 官方机器人 WebSocket 网关
    "fastapi>=0.115",            # iOS 官方渠道 API / SSE
    "uvicorn>=0.30",             # App API 的 ASGI 进程
    "python-multipart>=0.0.9",   # 安全解析文字 + 图片上传
    "cbor2>=5.6",                # Apple App Attest attestation object
    "httpx[http2]>=0.27",        # APNs provider 必须使用 HTTP/2
]

[project.scripts]
murmur = "murmur.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",   # lint；测试是 tests/ 里的自包含脚本，不需要 pytest
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["murmur"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 注释里大量中文说明，行长限制意义不大
ignore = ["E501"]

[tool.ruff.lint.isort]
# Root-invoked lint must still recognize the package after moving pyproject.toml.
known-first-party = ["murmur"]

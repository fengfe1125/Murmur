name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # 当年今日 introduced the first Metal shader and the first PhotoKit
      # authorization branches; both fail at runtime, not at compile time,
      # which is why this workflow exists.  The Metal toolchain is a separate
      # component on Xcode 26 and must be fetched explicitly.
      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build
        run: >-
          xcodebuild -project MurmurApp.xcodeproj -scheme Murmur
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          build
      - name: Unit tests
        run: >-
          xcodebuild test -project MurmurApp.xcodeproj -scheme Murmur
          -destination 'platform=iOS Simulator,name=iPhone 17'
          -only-testing:MurmurTests
